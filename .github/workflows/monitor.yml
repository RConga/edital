name: Monitor de editais PNCP - TI

on:
  schedule:
    # Todo dia às 11:00 UTC = 08:00 no horário de Brasília
    - cron: "0 11 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write   # necessário para o bot commitar o cache (visto.json)

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar o agente
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor_pncp.py

      - name: Salvar cache de itens já vistos
        run: |
          git config user.name "pncp-bot"
          git config user.email "pncp-bot@users.noreply.github.com"
          git add visto.json
          git diff --staged --quiet && exit 0

          git commit -m "Atualiza cache de editais vistos"

          for tentativa in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejeitado, sincronizando com origin/main (tentativa $tentativa)..."
            git pull --rebase origin main
          done

          echo "Falha ao dar push do cache após várias tentativas." >&2
          exit 1
